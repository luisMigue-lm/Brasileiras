<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/header-style.css">
    <link rel="stylesheet" href="/css/footer-style.css">
    <link rel="stylesheet" href="/css/cliente.css">
    <title>Meu Perfil | Brasileiras</title>
</head>

<body>
    <header class="header-nav">

        <nav class="navegacao">
            <div class="logo">
                <a th:href="@{/}">
                    <img src="/img/logo/brasileiras-logo2.svg" alt="Brasileiras - logotipo" id="logo-tipo">
                </a>
            </div>

            <div class="barra-pesquisa">
                <form method="post" action="">
                    <input type="text" name="barra-pesquisa" placeholder="O que vamos procurar hoje?">

                    <button type="submit"><img src="/img/icons/lupa.svg" alt="lupa de pesquisa" id="lupa"></button>
                </form>
            </div>

            <div class="campo-usuario">
                <a th:href="@{/cadastro-cliente}">
                    <img src="/img/icons/user.svg" alt="ícone de usuário" id="user-img">
                    <p>Crie sua conta</p>
                </a>

                <a th:href="@{/login}">
                    <p>Entre</p>
                </a>

            </div>
            <div class="carrinho">
                <a href=""><img src="/img/icons/carrinho.svg" alt="carrinho de compras" id="carrinho"></a>
            </div>
        </nav>
    </header>

    <section class="corpo">
        <div class="opcoes">
            <div class="opcoes-titulo">
                <img src="/img/icons/user-verde.svg" alt="">
                <h3>Minha conta</h3>
            </div>
            <ul>
                <li><a th:href="@{/cliente}" class="active">Perfil</a></li>
                <li><a th:href="@{/cliente/enderecos}">Endereços</a></li>
                <li><a th:href="@{/cliente/pedidos}">Meus pedidos</a></li>
            </ul>
        </div>
        <div class="informacoes">
            <div>
                <h3>Meu Perfil</h3>
                <div>
                    <form th:action="@{/atualizar-cliente}" method="post" enctype="multipart/form-data">

                        <div class="perfil-container">
                            <div class="form-fields">
                                <div class="form nome">
                                    <label for="nome">Nome:</label>
                                    <input type="text" th:name="nome" id="nome" required />
                                </div>

                                <div class="form email">
                                    <label for="email">Email:</label>
                                    <input type="email" id="email" th:name="email" required />
                                </div>

                                <div class="form telefone">
                                    <label for="telefone">Telefone:</label>
                                    <input type="tel" id="telefone" th:name="telefone" required />
                                </div>

                                <div class="form dt-nascimento">
                                    <label for="dtNascimento">Data de Nascimento:</label>
                                    <input type="date" th:name="dtNascimento" id="dtNascimento" required>
                                </div>

                                <div class="form cpf">
                                    <label for="cpf">CPF:</label>
                                    <input type="text" id="cpf" th:name="cpf" required />
                                </div>

                                <div class="form senha">
                                    <label for="senha">Senha:</label>
                                    <div class="senha-container">
                                        <input type="password" id="senha" th:name="senha" required>
                                        <img src="/img/icons/olho-fechado.svg" alt="exibir senha" id="toggle-senha">
                                    </div>
                                </div>


                                <div class="btn-atualizar">
                                    <button type="submit">Salvar alterações</button>
                                </div>
                            </div>
                            <div class="foto-upload">
                                <label for="foto">
                                    <img src="/img/icons/foto-cliente.svg" alt="campo para cadastrar foto do cliente"
                                        id="preview-foto">
                                </label>
                                <input type="file" th:name="foto" id="foto" accept="image/*">
                                <label for="foto" class="btn-foto">Selecione a imagem</label>
                                <p>Extensão de arquivo: .JPEG, .PNG</p>
                            </div>

                        </div>


                </div>
            </div>
    </section>

    <footer class="rodape">
        <div class="logo-footer">
            <a th:href="@{/}">
                <img src="/img/logo/brasileiras-logo2.svg" alt="Brasileiras - logotipo" id="logo-rodape">
            </a>
        </div>

        <div class="texto-footer">
            <p><a th:href="@{/}">Voltar ao Início</a></p>
            <p>© 2025 Brasileiras.com</p>
        </div>

    </footer>
    <script src="/js/troca-icons.js"></script>
    <script src="/js/preview-foto.js"></script>
    <script src="/js/toggle-senha.js"></script>
</body>

</html>
