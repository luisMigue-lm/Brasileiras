<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="imagex/svg" href="/img/logo/brasileiras-logo3.svg">
    <link rel="stylesheet" href="/css/header-style.css">
    <link rel="stylesheet" href="/css/footer-style.css">
    <link rel="stylesheet" href="/css/temp-style.css">
    <link rel="stylesheet" href="/css/style.css">
    <title>Brasileiras | Bem-vindo(a)</title>
</head>

<body>
    <header class="header-nav">

        <nav class="navegacao">
            <div class="logo">
                <a th:href="@{/}">
                    <img src="/img/logo/brasileiras-logo2.svg" alt="Brasileiras - logotipo" id="logo-tipo">
                </a>
            </div>

            <div class="barra-pesquisa">
                <form method="post" action="">
                    <input type="text" name="barra-pesquisa" placeholder="O que vamos procurar hoje?">

                    <button type="submit"><img src="/img/icons/lupa.svg" alt="lupa de pesquisa" id="lupa"></button>
                </form>
            </div>

            <div class="campo-usuario">
                <div th:if="${session.clienteLogado == null}">
                    <a th:href="@{/cadastro-cliente}">
                        <img src="/img/icons/user.svg" alt="ícone de usuário" id="user-img">
                        <p>Crie sua conta</p>
                    </a>

                    <a th:href="@{/login}">
                        <p>Entre</p>
                    </a>
                </div>
                <div th:if="${session.clienteLogado != null}" class="usuario-logado">
                    <a th:href="@{/cliente/{id}(id=${session.clienteLogado.id})}">
                        <img src="/img/icons/user.svg" alt="ícone de usuário" id="user-img">
                        <p>Olá, <span th:text="${session.clienteLogado.nome}"></span></p>
                    </a>

                </div>

            </div>
            <div class="carrinho">
                <a href="/carrinho"><img src="/img/icons/carrinho.svg" alt="carrinho de compras" id="carrinho"></a>
            </div>
        </nav>
    </header>

    <div class="tabelas">
        <table>
            <tr>
                <th>Produtos</th>
            </tr>
            <tr>
                <th>Foto</th>
                <th>Nome</th>
                <th>Detalhes</th>
                <th>Atualizar</th>
            </tr>
            <tr th:each="produto : ${produtos}">
                <td>
                    <img th:src="@{${produto.caminhoFoto}}" alt="foto" width="100" height="100">
                </td>
                <td>[[${produto.nome}]]</td>
                <td><a th:href="@{/produto/{id}(id=${produto.id})}">Clique aqui</a></td>
                <td><a th:href="@{/produto/editar/{id}(id=${produto.id})}">Clique aqui</a></td>
            </tr>
        </table>
    </div>

    <footer class="rodape">
        <div class="logo-footer">
            <a th:href="@{/}">
                <img src="/img/logo/brasileiras-logo2.svg" alt="Brasileiras - logotipo" id="logo-rodape">
            </a>
        </div>

        <div class="texto-footer">
            <p><a th:href="@{/}">Voltar ao Início</a></p>
            <p>© 2025 Brasileiras.com</p>
        </div>

    </footer>

    <script src="/js/troca-icons.js"></script>
</body>

</html>
